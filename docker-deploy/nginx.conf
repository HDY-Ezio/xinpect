# ============================================================
# 煋鉴 Xinpect - Nginx 容器内配置
# 反代 Flask 应用(8621) + 静态资源 + SSL
# ============================================================

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name _;

    # ACME challenge (Let's Encrypt 证书验证)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 其他请求重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主服务
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # SSL 证书（由宿主机挂载）
    ssl_certificate     /etc/letsencrypt/live/xinpect.xingwangzhineng.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xinpect.xingwangzhineng.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # 防机器人扫描
    location ~ /(wp-admin|wp-login|\.git|\.env|\.svn|phpmyadmin|admin\.php|config\.php|actuator|fetch|proxy) {
        return 444;
    }

    # 上传大小限制
    client_max_body_size 50M;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 500;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml text/javascript application/xml;

    # ── 静态资源（nginx 直接服务，不经过 Flask）──
    location /static/ {
        alias /opt/xinpect-website/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── CI/CD API ──
    location /api/ci/ {
        proxy_pass http://127.0.0.1:8621/api/ci/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 50M;
    }

    # ── 徽章 SVG ──
    location /api/badge/ {
        proxy_pass http://127.0.0.1:8621/api/badge/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── 分享报告 ──
    location /report/share/ {
        proxy_pass http://127.0.0.1:8621/report/share/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── 所有其他请求 → Flask ──
    location / {
        proxy_pass http://127.0.0.1:8621;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
