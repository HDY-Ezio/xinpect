<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="stylesheet" href="/static/css/tokens.css?v={{ asset_v }}">
    <link rel="stylesheet" href="/static/css/cool-fx.css?v={{ asset_v }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}煋鉴管理后台{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-v-segoe-ui-c790ad); background: var(--color-v-f0f2f5); color: var(--color-bg-secondary); }
        .sidebar { position: fixed; left: 0; top: 0; width: 240px; height: 100vh; background: var(--color-bg-secondary); color: var(--color-text-inverse); padding: 20px 0; }
        .sidebar .logo { padding: 0 20px 20px; border-bottom: 1px solid var(--color-v-f03cfbfe3); font-size: 20px; font-weight: bold; }
        .sidebar nav { padding: 20px 0; }
        .sidebar nav a { display: block; padding: 12px 20px; color: var(--color-v-e8e8e8); text-decoration: none; transition: background-color 0.3s, color 0.3s, border-color 0.3s, box-shadow 0.3s, opacity 0.3s, transform 0.3s; opacity: 0.7; }
        .sidebar nav a:hover, .sidebar nav a.active { background: var(--color-v-fa3f58602); color: var(--color-text-inverse); border-left: 3px solid var(--color-v-5b8def); opacity: 1; }
        .main { margin-left: 240px; padding: 20px; }
        .header { background: var(--color-bg-primary); padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 8px var(--color-v-f425bff1f); }
        .card { background: var(--color-bg-primary); border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px var(--color-v-f425bff1f); }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .stat-card { background: var(--color-bg-primary); border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px var(--color-v-f425bff1f); }
        .stat-card .label { color: var(--color-v-666666); font-size: 14px; margin-bottom: 8px; }
        .stat-card .value { font-size: 28px; font-weight: bold; color: var(--color-bg-secondary); }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--color-v-eeeeee); }
        th { background: var(--color-v-f8f9fa); font-weight: 500; color: var(--color-v-666666); }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
        .badge-success { background: var(--color-v-dbeafe); color: var(--color-info); }
        .badge-warning { background: var(--color-v-e8e8e8); color: var(--color-bg-secondary); }
        .badge-danger { background: var(--color-v-fee2e2); color: var(--color-danger); }
        .badge-info { background: var(--color-v-e0e7ff); color: var(--color-v-3730a3); }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; transition: background-color 0.3s, color 0.3s, border-color 0.3s, box-shadow 0.3s, opacity 0.3s, transform 0.3s; }
        .btn-primary { background: var(--color-bg-secondary); color: var(--color-text-inverse); }
        .btn-primary:hover { background: var(--color-v-2a3d5e); }
        .btn-secondary { background: var(--color-v-6c757d); color: var(--color-text-inverse); }
        .btn-secondary:hover { background: var(--color-v-5a6268); }
        .btn-success { background: var(--color-v-5b8def); color: var(--color-text-inverse); }
        .btn-success:hover { background: var(--color-v-4a7cde); }
        .pagination { display: flex; gap: 8px; justify-content: center; margin-top: 20px; }
        .pagination button { padding: 8px 12px; border: 1px solid var(--color-v-dddddd); background: var(--color-bg-primary); cursor: pointer; border-radius: 4px; }
        .pagination button.active { background: var(--color-bg-secondary); color: var(--color-text-inverse); border-color: var(--color-bg-secondary); }
        .search-box { padding: 8px 12px; border: 1px solid var(--color-v-dddddd); border-radius: 4px; width: 300px; }
        select.filter-select { padding: 8px 12px; border: 1px solid var(--color-v-dddddd); border-radius: 4px; background: var(--color-bg-primary); color: var(--color-bg-secondary); min-width: 120px; }
        input[type="date"].filter-date { padding: 8px 12px; border: 1px solid var(--color-v-dddddd); border-radius: 4px; background: var(--color-bg-primary); color: var(--color-bg-secondary); }
        .filter-bar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; align-items: center; }
        .filter-bar label { font-size: 13px; color: var(--color-v-666666); margin-right: 4px; }
        .filter-bar .filter-group { display: flex; align-items: center; gap: 6px; }
        /* Modal */
        .modal-overlay { display: none; position: fixed; inset: 0; background: var(--color-v-f0729ae0e); z-index: 1000; justify-content: center; align-items: center; }
        .modal-overlay.show { display: flex; }
        .modal-box { background: var(--color-bg-primary); border-radius: 10px; padding: 24px; width: 420px; max-width: 90vw; box-shadow: 0 10px 40px var(--color-v-f293eba74); }
        .modal-box h3 { margin-bottom: 16px; color: var(--color-bg-secondary); }
        .modal-box .info-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--color-v-eeeeee); }
        .modal-box .info-row .label { color: var(--color-v-666666); }
        .modal-box .info-row .val { color: var(--color-bg-secondary); font-weight: 500; }
        .modal-box .modal-actions { margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">煋鉴管理后台</div>
        <nav>
            <a href="/admin" class="{% if request.path == '/admin' %}active{% endif %}">📊 数据看板</a>
            <a href="/admin/users" class="{% if request.path == '/admin/users' %}active{% endif %}">👥 用户管理</a>
            <a href="/admin/orders" class="{% if request.path == '/admin/orders' %}active{% endif %}">📦 订单管理</a>
            <a href="/admin/invoices" class="{% if request.path == '/admin/invoices' %}active{% endif %}">🧾 发票管理</a>
            <a href="/admin/scans" class="{% if request.path == '/admin/scans' %}active{% endif %}">🔍 扫描记录</a>
            <a href="/admin/devices" class="{% if request.path == '/admin/devices' %}active{% endif %}">🔐 设备管理</a>
            <a href="/" style="margin-top: 40px; border-top: 1px solid var(--color-v-f03cfbfe3); padding-top: 20px;">← 返回前台</a>
        </nav>
    </div>
    <div class="main">
        {% block content %}{% endblock %}
    </div>
    <!-- User Detail Modal -->
    <div class="modal-overlay" id="user-modal" onclick="if(event.target===this)closeUserModal()">
        <div class="modal-box" id="user-modal-body"></div>
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
