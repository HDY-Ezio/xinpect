{% extends "admin/base.html" %}
{% block title %}订单管理 - 煋鉴管理后台{% endblock %}
{% block content %}
<div class="header">
    <h1>订单管理</h1>
</div>

<div class="filter-bar">
    <div class="filter-group">
        <label>状态：</label>
        <select class="filter-select" id="status-filter" onchange="loadOrders()">
            <option value="">全部</option>
            <option value="pending">待支付</option>
            <option value="paid">已支付</option>
            <option value="refunded">已退款</option>
            <option value="cancelled">已取消</option>
        </select>
    </div>
    <div class="filter-group">
        <label>起始日期：</label>
        <input type="date" class="filter-date" id="start-date" onchange="loadOrders()">
    </div>
    <div class="filter-group">
        <label>截止日期：</label>
        <input type="date" class="filter-date" id="end-date" onchange="loadOrders()">
    </div>
    <div class="filter-group">
        <label>最小金额：</label>
        <input type="number" class="filter-date" id="min-amount" style="width:100px" placeholder="0" onchange="loadOrders()">
    </div>
    <div class="filter-group">
        <label>最大金额：</label>
        <input type="number" class="filter-date" id="max-amount" style="width:100px" placeholder="不限" onchange="loadOrders()">
    </div>
    <button class="btn btn-primary" onclick="loadOrders()">筛选</button>
</div>

<div class="card">
    <table>
        <thead>
            <tr>
                <th>订单号</th>
                <th>用户</th>
                <th>金额</th>
                <th>状态</th>
                <th>下单时间</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="orders-table"></tbody>
    </table>
    <div class="pagination" id="pagination"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentPage = 1;

async function loadOrders(page = 1) {
    currentPage = page;
    const params = new URLSearchParams({page});
    const status = document.getElementById("status-filter").value;
    const startDate = document.getElementById("start-date").value;
    const endDate = document.getElementById("end-date").value;
    const minAmount = document.getElementById("min-amount").value;
    const maxAmount = document.getElementById("max-amount").value;
    if (status) params.set("status", status);
    if (startDate) params.set("start_date", startDate);
    if (endDate) params.set("end_date", endDate);
    if (minAmount) params.set("min_amount", minAmount);
    if (maxAmount) params.set("max_amount", maxAmount);

    const res = await fetch(`/api/admin/orders?${params}`);
    const data = await res.json();

    const statusMap = {paid: ['已支付','badge-success'], pending: ['待支付','badge-warning'], cancelled: ['已取消','badge-danger'], refunded: ['已退款','badge-info']};
    const tbody = document.getElementById("orders-table");
    tbody.innerHTML = data.orders.map(o => {
        const st = statusMap[o.status] || [o.status, ''];
        return `<tr>
            <td><code>${o.order_id}</code></td>
            <td>${o.user_email || "用户#" + o.user_id}</td>
            <td>¥${o.amount}</td>
            <td><span class="badge ${st[1]}">${st[0]}</span></td>
            <td>${o.created_at || "-"}</td>
            <td><button class="btn btn-secondary" onclick="alert('订单号: ${o.order_id}\\n用户: ${o.user_email||o.user_id}\\n金额: ¥${o.amount}\\n状态: ${st[0]}')">详情</button></td>
        </tr>`;
    }).join("");

    const totalPages = Math.ceil(data.total / data.per_page);
    const pagination = document.getElementById("pagination");
    pagination.innerHTML = "";
    for (let i = 1; i <= totalPages; i++) {
        pagination.innerHTML += `<button class="${i === page ? 'active' : ''}" onclick="loadOrders(${i})">${i}</button>`;
    }
}

loadOrders();
</script>
{% endblock %}
