{% extends "dashboard/base.html" %}

{% block title %}团队邀请 - 煋鉴 Xinpect{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/team.css') }}?v=20261109.1">
<style>
    .team-page .invite-wrap {
        max-width: 520px;
        margin: 24px auto 48px;
    }
    .team-page .invite-card {
        text-align: center;
        padding: 40px 32px;
    }
    .team-page .invite-brand {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 2px;
        color: var(--color-accent-blue);
    }
    .team-page .invite-brand-sub {
        font-size: 13px;
        color: var(--color-text-muted);
        margin-bottom: 28px;
    }
    .team-page .invite-icon {
        width: 64px;
        height: 64px;
        border-radius: var(--radius-lg);
        background: var(--color-metal-gold-tint);
        border: 1px solid var(--color-metal-gold);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        font-size: 28px;
    }
    .team-page .invite-card h2 { font-size: var(--text-lg); margin: 0 0 8px; display: block; text-align: center; }
    .team-page .invite-name { color: var(--color-accent-blue); }
    .team-page .invite-desc {
        font-size: 14px;
        color: var(--color-text-secondary);
        margin: 0 auto 28px;
        line-height: 1.7;
        max-width: 40ch;
    }
    .team-page .invite-btns { display: flex; gap: 12px; }
    .team-page .invite-btns .btn { flex: 1; }
    .team-page .invite-result {
        display: none;
        margin-top: 18px;
        padding: 12px 16px;
        border-radius: var(--radius-sm);
        font-size: 14px;
        text-align: left;
    }
    .team-page .invite-result.success {
        display: block;
        background: var(--color-surface-inset);
        color: var(--color-success);
    }
    .team-page .invite-result.error {
        display: block;
        background: var(--color-danger-tint);
        color: var(--color-danger);
    }
</style>
{% endblock %}

{% block dashboard_content %}
<div class="team-page">
    <div class="crumb"><a href="/dashboard/team">我的团队</a> / 邀请</div>

    <div class="invite-wrap">
        <div class="panel-card invite-card">
            <div class="invite-brand">煋鉴</div>
            <div class="invite-brand-sub">AI 代码质量审计平台</div>

            <div class="invite-icon" aria-hidden="true">👥</div>
            <h2>你被邀请加入</h2>
            <p class="invite-desc">
                <strong class="invite-name">{{ invite.team_name }}</strong><br>
                加入后可以查看团队共享的扫描结果，用团队共享积分做代码扫描。
            </p>

            <div class="invite-btns">
                <button class="btn btn-secondary" onclick="reject()">拒绝</button>
                <button class="btn btn-primary" id="acceptBtn" onclick="accept()">接受邀请</button>
            </div>

            <div class="invite-result" id="result"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    var invitationId = {{ invite.id }};

    async function accept() {
        var btn = document.getElementById('acceptBtn');
        btn.disabled = true;
        btn.textContent = '处理中...';
        try {
            var resp = await fetch('/api/teams/invitations/' + invitationId + '/accept', { method: 'POST' });
            var data = await resp.json();
            var result = document.getElementById('result');
            if (data.code === 0) {
                result.className = 'invite-result success';
                result.textContent = '已加入团队！即将跳转...';
                setTimeout(function () { window.location = '/dashboard/team'; }, 1500);
            } else {
                result.className = 'invite-result error';
                result.textContent = data.msg || '操作失败';
                btn.disabled = false;
                btn.textContent = '接受邀请';
            }
        } catch (e) {
            document.getElementById('result').className = 'invite-result error';
            document.getElementById('result').textContent = '网络错误，请重试';
            btn.disabled = false;
            btn.textContent = '接受邀请';
        }
    }

    async function reject() {
        try {
            await fetch('/api/teams/invitations/' + invitationId + '/reject', { method: 'POST' });
            window.location = '/dashboard/team';
        } catch (e) { alert('操作失败'); }
    }
</script>
{% endblock %}
