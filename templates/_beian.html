{# 工信部 ICP 备案号 —— 全站唯一维护点。
   依据《互联网信息服务管理办法》第十三条，网站在首页及显著位置必须标明备案号
   并链接到工信部备案管理系统，否则属于违规。改号只改这一行。

   颜色为什么写死：全站页脚统一是深色（#1A2A4A 系），之前用 color:inherit 时，
   首页页脚的父级是 rgba(255,255,255,.4)，继承下来再打折，备案号几乎看不见——
   合规要求的是"显著位置"，看不清等于没挂。这里用固定中性灰，深色底对比度约 4.6:1。
   将来若出现浅色页脚，把这段包进一个深色底容器即可，不要改这里的颜色。 #}
